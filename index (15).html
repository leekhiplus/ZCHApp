<style>
:root{--bg:#000;--s1:#141416;--s2:#232328;--mu:#9a9aa5;--ac:#25f4ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,sans-serif}
header{flex:none;height:50px;padding:0 12px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:15px;font-weight:600}
.chip{background:var(--s2);border-radius:14px;padding:5px 11px;font-size:12px;cursor:pointer}
#tx{background:linear-gradient(90deg,var(--ac),#5ef0ff);color:#000;font-weight:700;padding:8px 18px;border-radius:18px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#pv{flex:none;display:flex;flex-direction:column;padding:0 10px}
#pw{flex:none;height:30vh;min-height:140px;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:6px;background:#000}
#tp{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:6px 0 0;color:var(--mu);font-size:12px}
#pp{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;font-size:15px;padding:0;font-weight:700}
#sk{flex:none}
#tl{flex:none;width:100%;height:64px;margin-top:2px;border-radius:8px;cursor:pointer;display:block}
#msg{flex:none;color:#ff8a9b;font-size:12px;margin:2px 0}#msg:empty{display:none}
button,select,input,textarea{font:inherit;color:#fff;background:var(--s2);border:0;border-radius:10px;padding:9px}
button{cursor:pointer}button:active{opacity:.7}button.r{background:var(--ac);color:#000;font-weight:700}
label{display:block;margin:10px 0 4px;font-size:12px;color:var(--mu)}
input[type=text],textarea,select,input[type=number]{width:100%}
input[type=range]{width:100%;padding:0;accent-color:var(--ac);background:none;height:22px}
input[type=color]{padding:2px;height:36px;width:100%}input[type=checkbox]{width:auto;accent-color:var(--ac)}
input[type=file]{width:100%;font-size:12px}textarea{min-height:60px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:70px}
#side{display:block;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--s1);border-radius:18px 18px 0 0;padding:0 14px 16px}
@media(min-width:900px){main{flex-direction:row}#pv{flex:1;min-width:0}#pw{flex:1;height:auto}#side{flex:none;width:380px;border-radius:0}}
@media(max-height:560px){#pw{height:22vh;min-height:90px}#sk,#tl{display:none}}
#sh{position:sticky;top:0;z-index:2;background:var(--s1);display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px}
#sh b{font-size:14px}#sx{background:none;font-size:18px;padding:4px 8px}
.pn{display:none}.pn.on{display:block}
#nv{flex:none;height:58px;background:var(--bg);border-top:1px solid #222;display:flex}
#nv button{flex:1 1 0;min-width:0;background:none;color:var(--mu);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;border-radius:0}
#nv button.on{color:#fff}#nv button.on svg{color:var(--ac)}#nv svg{width:22px;height:22px}
.card{display:flex;gap:8px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:6px;background:var(--s2)}
.card.on{border-color:var(--ac)}.card i{width:48px;height:32px;border-radius:5px;background:#3a3a44 center/cover;flex:none}
.card small{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.card button{padding:3px 9px;min-width:0;flex:none;background:#34343b}
#fp{margin-top:10px;padding:12px;background:#000;border-radius:10px;font-size:22px;text-align:center;line-height:1.9}
progress{accent-color:var(--ac)}
#ur{justify-self:end;display:flex;gap:8px}#ur button{width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}#ur svg{width:20px;height:20px}#ur button:disabled{opacity:.3}
#ith{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.th{width:56px;height:40px;border-radius:6px;background:#333 center/cover;position:relative;flex:none}.th b{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#fe2c55;font-size:11px;text-align:center;line-height:20px;cursor:pointer}
</style></head><body>

</div>
<div class="pn" id="p2">

<div class="row" style="margin-top:6px"><button id="ss">Start = playhead</button><button id="se">End = playhead</button></div>
<div class="row" style="margin-top:6px"><button id="cgap">Close gaps (start from 0, cards one after another)</button></div>
<div class="row" style="margin-top:6px"><button id="dist">Distribute card times evenly</button><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" data-g="ov" data-n>Allow overlapping cards</label></div>
<label>Voiceover (MP3, WAV, M4A, AAC)</label><input id="aud" type="file" accept="audio/*">
<div class="row"><div><label>Volume</label><input id="vol" type="range" min="0" max="1" step=".05" value="1"></div><button id="ra">Remove audio</button></div>
</div>
<div class="pn" id="p3">
<div class="row"><div><label>Aspect</label><select data-g="asp"><option>16:9</option><option>9:16</option><option>1:1</option></select></div><div><label>Resolution</label><select data-g="res" data-n><option value="720">720p</option><option value="1080">1080p</option></select></div><div><label>FPS</label><select data-g="fps" data-n><option>24</option><option>25</option><option>30</option></select></div></div>
<label>Video ends at</label><select data-g="endm"><option value="voice">End of voiceover</option><option value="card">End of last card</option></select>
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-g="tickOn" data-n>Show ticker</label>
<label>Ticker text</label><input type="text" data-g="tick" dir="auto">
<label>Ticker direction</label><div class="row" id="tdr"><button data-dir="1">◀ Right to left</button><button data-dir="-1">Left to right ▶</button></div>
<div class="row"><div><label>Speed</label><input type="range" data-g="tickSpd" data-n min="40" max="300"></div><div><label>Text</label><input type="color" data-g="tickC"></div><div><label>Bar</label><input type="color" data-g="tickBg"></div></div>
</div>
<div class="pn" id="p4">
<label>Channel name</label><input type="text" data-g="chan">
<label>Logo (transparent PNG)</label><div class="row"><input id="lg" type="file" accept="image/png" style="flex:3"><button id="rlg">Remove</button></div>

</div>
<div class="pn" id="p5">
<label>File name</label><input id="fn" type="text" value="zch-news">
<div class="row" style="margin-top:6px"><button id="ex1" class="r">Export video</button><button id="cx">Cancel</button></div>
<progress id="pg" max="1" value="0" style="width:100%;margin-top:6px"></progress><div id="xs"></div><a id="dl" style="display:none;color:#f5c518;margin-top:6px" href="#"></a>
</div>
<div class="pn" id="p6">
<label>Urdu font</label><select id="fsu" data-k="fu"></select>
<label>English font</label><select id="fse" data-k="fe"></select>
<div id="fp" dir="auto">بریکنگ نیوز — Breaking News 2026</div>
<div class="row"><div><label>Text size</label><input type="range" data-k="ts" data-n min=".5" max="1.6" step=".05"></div><div><label>Text color</label><input type="color" data-k="tc"></div><div><label>Background</label><input type="color" data-k="bg"></div></div>
<div class="row" style="margin-top:10px"><button id="fa">Apply fonts to all cards &amp; ticker</button></div>
<label>Upload your own font (.ttf, .otf, .woff2)</label><input id="fnt" type="file" accept=".ttf,.otf,.woff,.woff2">
</div>
<div class="pn" id="p7">
<div class="row"><div><label>Text animation</label><select id="ta" data-k="ta" data-n></select></div><div><label>Image animation</label><select id="ia" data-k="ia" data-n></select></div></div>

<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-k="ol" data-n>Lower-third bar with text</label>

<div class="row" style="margin-top:8px"><button id="fxref" class="r">Use reference style</button><button id="fxall">Apply to all cards</button></div>
</div>
<div class="pn" id="p8">
<label>Gemini API key</label>

<div id="gst" style="font-size:12px;color:var(--mu);margin-top:4px"></div>
<div class="row"><div><label>Model</label><select data-g="gm"><option value="gemini-3.8-flash-tts">Gemini 3.8 Flash TTS</option><option value="gemini-3.8-flash-lite-tts">Gemini 3.8 Flash-Lite TTS</option></select></div><div><label>Voice</label><select data-g="gv" id="gvs"></select></div></div>

<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-k="cap" data-n>Show the script on the card, synced with the voice</label>

<div id="vst" style="font-size:12px;color:var(--mu);margin-top:8px"></div>
</div></section></main><nav id="nv"></nav>
<script>
